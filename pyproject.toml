[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "jwt-audit"
version = "0.3.0"
description = "Authorization-first active and offline JWT security auditor"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Liam Giannini, Webcracy.ch" }]
maintainers = [{ name = "Liam Giannini, Webcracy.ch" }]
keywords = ["jwt", "security", "audit", "owasp"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.14",
  "Topic :: Security",
]
dependencies = [
  "PyJWT>=2.9,<3",
  "requests>=2.32,<3",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.13,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.8,<1",
  "types-requests>=2.32",
]

[project.scripts]
jwt-audit = "jwt_audit.cli:main"

[project.urls]
Homepage = "https://webcracy.ch"
Repository = "https://github.com/Liam-G/jwt-audit"
Issues = "https://github.com/Liam-G/jwt-audit/issues"
"Security policy" = "https://github.com/Liam-G/jwt-audit/security/policy"

[tool.hatch.build]
exclude = [
  "/.coverage",
  "/.mypy_cache",
  "/.pytest_cache",
  "/.ruff_cache",
  "/.venv",
  "/[0-9]*.txt",
  "/jwt_success*.txt",
  "/*_domains.txt",
  "/*_ips.txt",
  "/read_configs.py",
  "/test.txt",
  "/test_*.py",
  "/urls.txt",
  "/jwt-audit-initial.bundle",
  "/*.patch",
]

[tool.hatch.build.targets.wheel]
packages = ["src/jwt_audit"]

[tool.pytest.ini_options]
addopts = "--strict-markers --cov=jwt_audit --cov-report=term-missing --cov-fail-under=85"
testpaths = ["tests"]
filterwarnings = [
  "ignore:The HMAC key is .*:jwt.warnings.InsecureKeyLengthWarning",
]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["read_configs.py", "test_[aj]*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["jwt_audit"]

